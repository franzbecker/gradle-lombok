plugins {
    id 'com.gradle.plugin-publish' version '2.2.1'
    id 'net.researchgate.release' version '3.2.0'
    id 'pl.droidsonroids.jacoco.testkit' version '1.0.12' // required until https://github.com/gradle/gradle/issues/1465 is resolved
    id 'java-gradle-plugin'
    id 'groovy'
    id 'jacoco'
}

group = 'io.franzbecker'

java {
    // keep Java 8 bytecode so the plugin still runs on Gradle 7.x builds using Java 8
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.release = 8
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.spockframework:spock-bom:2.5-groovy-3.0')
    testImplementation 'org.spockframework:spock-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    // integration tests download Gradle distributions and run builds
    maxParallelForks = Math.max(1, Runtime.runtime.availableProcessors().intdiv(2))
}

jacoco {
    toolVersion = "0.8.16"
}

jacocoTestReport {
    reports {
        xml.required = true
        html.required = true
    }
}

check.dependsOn jacocoTestReport

gradlePlugin {
    website = 'https://github.com/franzbecker/gradle-lombok'
    vcsUrl = 'https://github.com/franzbecker/gradle-lombok.git'
    plugins {
        lombokPlugin {
            id = 'io.franzbecker.gradle-lombok'
            displayName = 'Gradle Lombok plugin'
            description = 'A gradle plugin that simplifies the usage of the Lombok annotation processor.'
            implementationClass = 'io.franzbecker.gradle.lombok.LombokPlugin'
            // 'gradle' and 'plugin' are rejected by the Plugin Portal
            tags.set(['lombok', 'annotation-processing'])
        }
    }
}

tasks.register('updateReadmeVersion') {
    def readme = rootProject.file('../README.md')
    // evaluated lazily: the release plugin sets the release version during execution
    def releaseVersion = provider { project.version.toString() }
    doLast {
        def version = releaseVersion.get()
        def versionPattern = /\d+.\d+(.\d+)?/
        def encoding = 'UTF-8'

        // String replacements - Readme isn't long enough to justify advanced code ;)
        String text = readme.getText(encoding)
        text = text.replaceAll("gradle-lombok' version '${versionPattern}'", "gradle-lombok' version '${version}'")
        text = text.replaceAll("gradle-lombok/${versionPattern}", "gradle-lombok/${version}")

        readme.setText(text, encoding)
    }
}

/*
 * Configure release plugin.
 * Skip "updateVersion" and "commitNewVersion" as we don't want the new SNAPSHOT
 * version commit on the master branch.
 */
tasks.named('updateVersion') { enabled = false }
tasks.named('commitNewVersion') { enabled = false }
tasks.named('updateReadmeVersion') { shouldRunAfter 'confirmReleaseVersion' }
tasks.named('preTagCommit') { dependsOn 'updateReadmeVersion' }
release {
    preTagCommitMessage = '[release] '
    tagCommitMessage = '[release] '
    tagTemplate = 'v${version}'
    git {
        // release plugin 3.x defaults to 'main'
        requireBranch.set('master')
    }
}
