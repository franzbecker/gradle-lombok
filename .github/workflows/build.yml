name: Build

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Check plugin (unit, integration and Gradle compatibility tests)
        working-directory: gradle-lombok-plugin
        run: ./gradlew check
      - name: Build examples
        working-directory: examples
        run: ./gradlew build :delombok-gradle-groovy:javadoc :delombok-gradle-kotlin:javadoc
